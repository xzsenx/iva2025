<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IVA — Админ-панель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #3D4F4C;
    --bg-card: rgba(0,0,0,.22);
    --cream: #EDE6DA;
    --cream-dim: rgba(237,230,218,.55);
    --pink: #C9A4A0;
    --accent: #A8C5A0;
    --gold: #C8B07A;
    --danger: #C97070;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--cream);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .login {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
  }
  .login h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 6px;
  }
  .login .sub { color: var(--cream-dim); font-size: 14px; }
  .login .box {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 360px;
    margin-top: 16px;
  }
  .input {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--cream);
    font-size: 15px;
    font-family: inherit;
    width: 100%;
  }
  .input::placeholder { color: rgba(255,255,255,.4); }
  .btn {
    background: var(--pink);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn--secondary {
    background: transparent;
    border: 1px solid rgba(255,255,255,.18);
    color: var(--cream);
  }
  .btn--danger { background: var(--danger); }
  .error { color: #ff9090; font-size: 13px; min-height: 18px; }
  .app { display: none; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(0,0,0,.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar__title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .topbar__title small {
    font-family: 'Manrope', sans-serif;
    background: var(--pink);
    color: #fff;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .topbar__actions { display: flex; gap: 10px; align-items: center; }
  .sync-status {
    font-size: 12px;
    color: var(--cream-dim);
    padding: 4px 10px;
    border-radius: 8px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 8px 22px 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent;
    border: none;
    color: var(--cream-dim);
    padding: 12px 18px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--cream); }
  .tab.active {
    color: var(--cream);
    border-bottom-color: var(--pink);
  }
  .toolbar {
    padding: 16px 22px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar .input { max-width: 320px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 0 22px 60px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card__img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: rgba(255,255,255,.04);
  }
  .card__noimg {
    width: 100%;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.35);
    font-size: 12px;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .card__body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card__title { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .card__sub { font-size: 12px; color: var(--cream-dim); }
  .card__price { color: var(--pink); font-weight: 700; }
  .card__actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }
  .card__actions .btn { flex: 1; padding: 8px 12px; font-size: 13px; }
  .card__badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--gold);
    color: #2a2a1a;
    letter-spacing: .5px;
    text-transform: uppercase;
    width: fit-content;
  }
  .card__badge--hidden {
    background: var(--danger);
    color: #fff;
    font-size: 13px;
    padding: 5px 12px;
    letter-spacing: 1px;
  }
  .card { position: relative; }
  .card.is-hidden .card__img,
  .card.is-hidden .card__noimg,
  .card.is-hidden .card__body > *:not(.card__actions) { opacity: .5; }
  .card.is-hidden::after {
    content: "Скрыто";
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 2;
  }
  .card.is-selected {
    border-color: var(--pink);
    box-shadow: 0 0 0 2px var(--pink);
  }
  .card__select {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: rgba(0,0,0,.5);
    border: 2px solid #fff;
    cursor: pointer;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 16px;
    font-weight: 700;
    transition: background .15s;
  }
  .card.is-selected .card__select {
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }
  .bulk-bar {
    position: sticky;
    top: 60px;
    z-index: 50;
    background: var(--pink);
    color: #fff;
    padding: 10px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }
  .bulk-bar__count { font-weight: 700; }
  .bulk-bar button {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    color: #fff;
    border-radius: 8px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .bulk-bar button:hover { background: rgba(255,255,255,.28); }
  .bulk-bar__clear {
    margin-left: auto;
    background: transparent !important;
    border-color: rgba(255,255,255,.5) !important;
  }

  /* Toggle-switch checkbox (для "скрыть из каталога") */
  .toggle-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-field__label { flex: 1; }
  .toggle-field__title {
    font-size: 14px;
    font-weight: 600;
    color: var(--cream);
  }
  .toggle-field__hint {
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 2px;
  }
  .switch {
    position: relative;
    width: 50px;
    height: 28px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0; height: 0;
    position: absolute;
  }
  .switch__slider {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.15);
    border-radius: 28px;
    transition: background .2s;
    cursor: pointer;
  }
  .switch__slider::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .switch input:checked + .switch__slider { background: var(--danger); }
  .switch input:checked + .switch__slider::before { transform: translateX(22px); }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #2e3e3c;
    border-radius: 16px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    margin-bottom: 18px;
  }
  .modal .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .modal .row label { font-size: 12px; color: var(--cream-dim); }
  .modal textarea {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px;
    padding: 10px;
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    min-height: 70px;
    resize: vertical;
  }
  .modal__actions { display: flex; gap: 10px; margin-top: 10px; }
  .modal__actions .btn { flex: 1; }
  .img-preview {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
    margin-bottom: 8px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2a28;
    color: var(--cream);
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    opacity: 0;
    transition: opacity .25s;
    z-index: 1000;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .loading { padding: 40px; text-align: center; color: var(--cream-dim); }
</style>
</head>
<body>

<div class="login" id="loginScreen">
  <h1>ИВА</h1>
  <div class="sub">Админ-панель</div>
  <div class="box">
    <input class="input" id="loginUser" placeholder="Логин" autocomplete="username" value="admin">
    <input class="input" id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" id="loginBtn">Войти</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div class="topbar__title">ИВА <small>Админ</small></div>
    <div class="topbar__actions">
      <span class="sync-status" id="syncStatus"></span>
      <button class="btn btn--secondary" id="syncBtn">Синк сейчас</button>
      <button class="btn btn--secondary" id="logoutBtn">Выйти</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="showcase">Витрина</button>
    <button class="tab" data-tab="templates">Шаблоны</button>
    <button class="tab" data-tab="stems">Цветы</button>
    <button class="tab" data-tab="addons">Допы</button>
    <button class="tab" data-tab="orders">Заказы</button>
  </div>
  <div class="toolbar" id="toolbar">
    <input class="input" id="search" placeholder="Поиск по названию..." style="max-width:280px">
    <select class="input" id="sort" style="max-width:200px">
      <option value="default">По умолчанию</option>
      <option value="title">По названию A→Я</option>
      <option value="price_asc">Цена ↑</option>
      <option value="price_desc">Цена ↓</option>
      <option value="hidden_first">Сначала скрытые</option>
    </select>
    <select class="input" id="visibility" style="max-width:200px">
      <option value="all">Все</option>
      <option value="visible">Только показываемые</option>
      <option value="hidden">Только скрытые</option>
      <option value="no_photo">Без фото</option>
    </select>
    <button class="btn btn--secondary" id="selectAllBtn" style="padding:10px 14px">Выбрать всё</button>
    <span style="color:var(--cream-dim);font-size:13px;margin-left:auto" id="counter"></span>
  </div>
  <div class="bulk-bar" id="bulkBar" style="display:none">
    <span class="bulk-bar__count" id="bulkCount">0</span> выбрано
    <button id="bulkHide">Скрыть выбранные</button>
    <button id="bulkShow">Показать выбранные</button>
    <button id="bulkClear" class="bulk-bar__clear">Снять выделение</button>
  </div>
  <div id="content"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Редактировать товар</h2>
    <input type="hidden" id="mSource">
    <input type="hidden" id="mSourceId">

    <div class="row">
      <label>Фото</label>
      <img class="img-preview" id="mImgPreview" alt="" src="" style="display:none">
      <div id="mDropzone" style="border:2px dashed rgba(255,255,255,.18);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--cream-dim);font-size:13px;margin-bottom:8px">
        Перетащи фото сюда или кликни, чтобы выбрать
      </div>
      <input type="file" id="mPhotoFile" accept="image/*" style="display:none">
      <input class="input" id="mPhotoUrl" placeholder="...или вставь URL" style="font-size:12px">
      <div id="mUploadStatus" style="font-size:12px;color:var(--cream-dim);min-height:16px;margin-top:4px"></div>
    </div>
    <div class="row">
      <label>Название в мини-аппе (переопределение)</label>
      <input class="input" id="mTitle" placeholder="Оставь пустым чтобы взять из Posiflora">
    </div>
    <div class="row">
      <label>Описание</label>
      <textarea id="mDescription" placeholder="Текст под названием"></textarea>
    </div>
    <div class="row">
      <label>Бэдж</label>
      <select class="input" id="mBadge">
        <option value="">— нет —</option>
        <option value="hit">HIT</option>
        <option value="new">NEW</option>
        <option value="season">СЕЗОН</option>
        <option value="unique">UNIQUE</option>
      </select>
    </div>
    <label class="toggle-field" for="mHidden">
      <div class="toggle-field__label">
        <div class="toggle-field__title">Скрыть из каталога</div>
        <div class="toggle-field__hint">Товар останется в админке, но не появится в мини-аппе</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="mHidden">
        <span class="switch__slider"></span>
      </span>
    </label>

    <div class="modal__actions">
      <button class="btn btn--secondary" id="mCancel">Отмена</button>
      <button class="btn" id="mSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3001' : '';
const AUTH_KEY = 'iva_admin_basic';

function getAuth() { return sessionStorage.getItem(AUTH_KEY); }
function setAuth(u, p) { sessionStorage.setItem(AUTH_KEY, btoa(u + ':' + p)); }
function clearAuth() { sessionStorage.removeItem(AUTH_KEY); }

async function api(method, path, body) {
  const auth = getAuth();
  const res = await fetch(API + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(auth ? { Authorization: 'Basic ' + auth } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { clearAuth(); showLogin(); throw new Error('401'); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function $(s) { return document.querySelector(s); }
function $$(s) { return document.querySelectorAll(s); }

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function showLogin() {
  $('#loginScreen').style.display = 'flex';
  $('#app').style.display = 'none';
  $('#loginPass').value = '';
  $('#loginError').textContent = '';
}
function showApp() {
  $('#loginScreen').style.display = 'none';
  $('#app').style.display = 'block';
  loadTab(currentTab);
  updateSyncStatus();
}

$('#loginBtn').addEventListener('click', doLogin);
$('#loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const u = $('#loginUser').value.trim();
  const p = $('#loginPass').value;
  if (!u || !p) { $('#loginError').textContent = 'Заполни оба поля'; return; }
  setAuth(u, p);
  try {
    await api('GET', '/api/admin/categories');
    showApp();
  } catch (e) {
    clearAuth();
    $('#loginError').textContent = 'Неверный логин/пароль';
  }
}

$('#logoutBtn').addEventListener('click', () => { clearAuth(); showLogin(); });

let currentTab = 'showcase';
let lastData = [];
let selected = new Set();

function sourceForTab(tab) {
  return ({ showcase: 'bouquet', templates: 'spec', stems: 'item', addons: 'item' })[tab];
}

function updateBulkBar() {
  const bar = $('#bulkBar');
  if (selected.size === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  $('#bulkCount').textContent = selected.size;
}

function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  updateBulkBar();
  /* обновляем класс карточки без полного re-render */
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) card.classList.toggle('is-selected', selected.has(id));
}

function clearSelection() {
  selected.clear();
  updateBulkBar();
  $$('.card.is-selected').forEach(c => c.classList.remove('is-selected'));
}

async function bulkSetHidden(hidden) {
  if (selected.size === 0) return;
  const source = sourceForTab(currentTab);
  const ids = [...selected];
  const dataMap = new Map(lastData.map(d => [d.id, d]));
  let done = 0;
  for (const id of ids) {
    const d = dataMap.get(id);
    const ov = d?._override || {};
    try {
      await api('POST', '/api/admin/override', {
        source,
        source_id: id,
        title: ov.title || null,
        description: ov.description || null,
        photo_url: ov.photo_url || null,
        badge: ov.badge || null,
        hidden: hidden ? 1 : 0,
      });
      done++;
    } catch (e) { /* skip */ }
  }
  toast(`Обновлено: ${done}/${ids.length}`);
  clearSelection();
  loadTab(currentTab);
}

$$('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    $('#search').value = '';
    loadTab(currentTab);
  });
});

$('#search').addEventListener('input', () => render());
$('#sort').addEventListener('change', () => render());
$('#visibility').addEventListener('change', () => render());

$('#selectAllBtn').addEventListener('click', () => {
  const visibleIds = [...document.querySelectorAll('.card')].map(c => c.dataset.id);
  const allSelected = visibleIds.every(id => selected.has(id));
  if (allSelected) clearSelection();
  else {
    visibleIds.forEach(id => selected.add(id));
    $$('.card').forEach(c => c.classList.add('is-selected'));
    updateBulkBar();
  }
});

$('#bulkHide').addEventListener('click', () => bulkSetHidden(true));
$('#bulkShow').addEventListener('click', () => bulkSetHidden(false));
$('#bulkClear').addEventListener('click', clearSelection);

$('#syncBtn').addEventListener('click', async () => {
  $('#syncBtn').disabled = true;
  $('#syncBtn').textContent = 'Синк...';
  try {
    const r = await api('POST', '/api/admin/sync');
    toast('Синк ОК: ' + JSON.stringify(r.counts));
    updateSyncStatus();
    loadTab(currentTab);
  } catch (e) {
    toast('Ошибка синка');
  } finally {
    $('#syncBtn').disabled = false;
    $('#syncBtn').textContent = 'Синк сейчас';
  }
});

async function updateSyncStatus() {
  try {
    const hist = await api('GET', '/api/admin/sync/history');
    const last = hist[0];
    if (last) {
      const ago = Math.round((Date.now() - new Date(last.finished_at).getTime()) / 60000);
      $('#syncStatus').textContent = 'Синк ' + ago + ' мин назад · ' + (last.counts.specs||0) + ' шабл, ' + (last.counts.bouquets||0) + ' букетов, ' + (last.counts.items||0) + ' позиций';
    }
  } catch {}
}

async function loadTab(tab) {
  $('#content').innerHTML = '<div class="loading">Загрузка...</div>';
  try {
    if (tab === 'showcase') lastData = await api('GET', '/api/admin/bouquets?status=demonstrated');
    else if (tab === 'templates') lastData = await api('GET', '/api/admin/specs');
    else if (tab === 'stems') {
      const all = await api('GET', '/api/admin/inventory');
      lastData = all.filter(i => ['Цветы','Зелень','Сухоцветы'].includes(i.category_title));
    }
    else if (tab === 'addons') {
      const all = await api('GET', '/api/admin/inventory');
      lastData = all.filter(i => i.category_title && !['Цветы','Зелень','Сухоцветы'].includes(i.category_title));
    }
    else if (tab === 'orders') { renderOrders(); return; }
  } catch (e) {
    $('#content').innerHTML = '<div class="loading">Ошибка: ' + e.message + '</div>';
    return;
  }

  const overrides = await api('GET', '/api/admin/overrides').catch(() => []);
  const sourceMap = { showcase: 'bouquet', templates: 'spec', stems: 'item', addons: 'item' };
  const sourceKey = sourceMap[tab];
  const ovMap = new Map(overrides.filter(o => o.source === sourceKey).map(o => [o.source_id, o]));

  lastData = lastData.map(d => {
    const ov = ovMap.get(d.id);
    return Object.assign({}, d, { _override: ov || null });
  });

  render();
}

function getPrice(d) {
  if (currentTab === 'showcase') return d.price || d.true_sale_amount || d.sale_amount || 0;
  if (currentTab === 'templates') return d.min_price || d.max_price || 0;
  return d.price_max || 0;
}

function render() {
  const q = $('#search').value.toLowerCase().trim();
  const sort = $('#sort').value;
  const vis = $('#visibility').value;

  let filtered = lastData.slice();
  if (q) filtered = filtered.filter(d => (d.title || '').toLowerCase().includes(q));
  if (vis === 'hidden')  filtered = filtered.filter(d => d._override && d._override.hidden);
  if (vis === 'visible') filtered = filtered.filter(d => !d._override || !d._override.hidden);
  if (vis === 'no_photo') filtered = filtered.filter(d => !d._override || !d._override.photo_url);

  if (sort === 'title') filtered.sort((a,b) => (a.title||'').localeCompare(b.title||'', 'ru'));
  else if (sort === 'price_asc') filtered.sort((a,b) => getPrice(a) - getPrice(b));
  else if (sort === 'price_desc') filtered.sort((a,b) => getPrice(b) - getPrice(a));
  else if (sort === 'hidden_first') filtered.sort((a,b) => ((b._override?.hidden?1:0) - (a._override?.hidden?1:0)));

  $('#counter').textContent = filtered.length + ' из ' + lastData.length;

  if (!filtered.length) {
    $('#content').innerHTML = '<div class="loading">Ничего не найдено</div>';
    return;
  }

  $('#content').innerHTML = '<div class="grid">' + filtered.map(renderCard).join('') + '</div>';
  $$('.js-edit').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openEditor(b.dataset.id); }));
  $$('.card__select').forEach(sel => sel.addEventListener('click', e => {
    e.stopPropagation();
    toggleSelect(sel.dataset.id);
  }));
}

function renderCard(d) {
  const ov = d._override;
  const photo = ov && ov.photo_url;
  const title = (ov && ov.title) || d.title || '—';
  let sub = '';
  if (currentTab === 'showcase') sub = (d.price || d.true_sale_amount || d.sale_amount || 0) + ' ₽ · ' + (d.on_window_at||'').slice(0,10);
  else if (currentTab === 'templates') sub = (d.min_price||0) + '–' + (d.max_price||0) + ' ₽ · ' + (d.status||'');
  else sub = (d.category_title || '') + ' · до ' + (d.price_max||0) + ' ₽';
  const badge = ov && ov.badge ? '<span class="card__badge">' + ov.badge + '</span>' : '';
  const isHidden = ov && ov.hidden;
  const isSelected = selected.has(d.id);

  return '<div class="card' + (isHidden ? ' is-hidden' : '') + (isSelected ? ' is-selected' : '') + '" data-id="' + d.id + '">'
    + '<div class="card__select" data-id="' + d.id + '">✓</div>'
    + (photo ? '<img class="card__img" src="' + photo + '" alt="">' : '<div class="card__noimg">Нет фото</div>')
    + '<div class="card__body">'
    + '<div class="card__title">' + escapeHtml(title) + '</div>'
    + '<div class="card__sub">' + escapeHtml(sub) + '</div>'
    + (badge ? '<div style="display:flex;gap:4px">' + badge + '</div>' : '')
    + '<div class="card__actions"><button class="btn js-edit" data-id="' + d.id + '">Редактировать</button></div>'
    + '</div></div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function openEditor(id) {
  const item = lastData.find(d => d.id === id);
  if (!item) return;
  const ov = item._override || {};
  const sourceMap = { showcase: 'bouquet', templates: 'spec', stems: 'item', addons: 'item' };
  $('#mSource').value = sourceMap[currentTab];
  $('#mSourceId').value = id;
  $('#modalTitle').textContent = item.title || 'Редактирование';
  $('#mPhotoUrl').value = ov.photo_url || '';
  $('#mTitle').value = ov.title || '';
  $('#mDescription').value = ov.description || '';
  $('#mBadge').value = ov.badge || '';
  $('#mHidden').checked = !!ov.hidden;
  updateImgPreview();
  $('#modalOverlay').classList.add('active');
}

function updateImgPreview() {
  const url = $('#mPhotoUrl').value.trim();
  const img = $('#mImgPreview');
  if (url) {
    /* относительные ссылки (/uploads/...) рендерим через API base */
    img.src = url.startsWith('/') ? (API + url) : url;
    img.style.display = 'block';
  } else { img.style.display = 'none'; }
}
$('#mPhotoUrl').addEventListener('input', updateImgPreview);

/* === Загрузка файлов === */
async function uploadFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Только картинки'); return; }
  if (file.size > 10 * 1024 * 1024) { toast('Макс. 10 МБ'); return; }
  $('#mUploadStatus').textContent = 'Загрузка ' + Math.round(file.size/1024) + ' КБ...';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch(API + '/api/admin/upload', {
      method: 'POST',
      headers: { Authorization: 'Basic ' + getAuth() },
      body: fd,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    $('#mPhotoUrl').value = data.url || data.path;
    $('#mUploadStatus').textContent = 'Загружено ✓';
    updateImgPreview();
  } catch (e) {
    $('#mUploadStatus').textContent = 'Ошибка: ' + e.message;
  }
}

$('#mPhotoFile').addEventListener('change', e => uploadFile(e.target.files[0]));
const dz = $('#mDropzone');
dz.addEventListener('click', () => $('#mPhotoFile').click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = 'var(--pink)'; });
dz.addEventListener('dragleave', e => { dz.style.borderColor = 'rgba(255,255,255,.18)'; });
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.style.borderColor = 'rgba(255,255,255,.18)';
  if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
});

$('#mCancel').addEventListener('click', () => $('#modalOverlay').classList.remove('active'));
$('#modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') $('#modalOverlay').classList.remove('active'); });

$('#mSave').addEventListener('click', async () => {
  $('#mSave').disabled = true;
  try {
    await api('POST', '/api/admin/override', {
      source: $('#mSource').value,
      source_id: $('#mSourceId').value,
      title: $('#mTitle').value.trim() || null,
      description: $('#mDescription').value.trim() || null,
      photo_url: $('#mPhotoUrl').value.trim() || null,
      badge: $('#mBadge').value || null,
      hidden: $('#mHidden').checked ? 1 : 0,
    });
    toast('Сохранено ✓');
    $('#modalOverlay').classList.remove('active');
    loadTab(currentTab);
  } catch (e) {
    toast('Ошибка: ' + e.message);
  } finally {
    $('#mSave').disabled = false;
  }
});

async function renderOrders() {
  try {
    const orders = await fetch(API + '/api/orders', {
      headers: { Authorization: 'Basic ' + getAuth() },
    }).then(r => r.json());
    if (!orders.length) {
      $('#content').innerHTML = '<div class="loading">Заказов пока нет</div>';
      $('#counter').textContent = '0 заказов';
      return;
    }
    const html = orders.map(o => {
      const itemsHtml = (o.items || []).map(i => '• ' + escapeHtml(i.name) + ' ×' + i.qty + ' = ' + ((i.price||0) * i.qty).toLocaleString('ru-RU') + ' ₽').join('<br>');
      const delivery = o.delivery_type === 'delivery' ? '🚚 ' + (o.customer_address || '') : '🏪 Самовывоз';
      return '<div style="background:var(--bg-card);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:12px">'
        + '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'
        + '<strong>#' + o.id + ' — ' + escapeHtml(o.customer_name||'') + '</strong>'
        + '<span style="color:var(--cream-dim);font-size:12px">' + new Date(o.created_at).toLocaleString('ru-RU') + '</span>'
        + '</div>'
        + '<div style="color:var(--cream-dim);font-size:13px;margin-bottom:8px">📱 ' + escapeHtml(o.customer_phone||'') + ' · ' + escapeHtml(delivery) + ' · 📅 ' + escapeHtml(o.delivery_date||'') + ' ' + escapeHtml(o.delivery_time||'') + '</div>'
        + '<div style="margin-bottom:8px;font-size:13px">' + itemsHtml + '</div>'
        + '<div style="display:flex;gap:8px;align-items:center">'
        + '<strong style="color:var(--pink)">' + (o.total_price||0).toLocaleString('ru-RU') + ' ₽</strong>'
        + '<span style="background:rgba(255,255,255,.08);padding:3px 10px;border-radius:8px;font-size:12px">' + (o.payment_status || o.status || '') + '</span>'
        + '</div>'
        + (o.comment ? '<div style="color:var(--cream-dim);font-size:13px;margin-top:6px">💬 ' + escapeHtml(o.comment) + '</div>' : '')
        + '</div>';
    }).join('');
    $('#content').innerHTML = '<div style="padding:0 22px 60px">' + html + '</div>';
    $('#counter').textContent = orders.length + ' заказ(ов)';
  } catch (e) {
    $('#content').innerHTML = '<div class="loading">Ошибка: ' + e.message + '</div>';
  }
}

if (getAuth()) {
  api('GET', '/api/admin/categories').then(showApp).catch(showLogin);
} else {
  showLogin();
}
</script>
</body>
