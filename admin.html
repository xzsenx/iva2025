<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>IVA — Админ-панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Переменные (те же, что и в витрине) ── */
    :root {
      --bg:        #3D4F4C;
      --bg-light:  #4A5E5A;
      --bg-card:   rgba(0,0,0,.22);
      --cream:     #EDE6DA;
      --cream-dim: rgba(237,230,218,.6);
      --pink:      #C9A4A0;
      --pink-light:#D4B5B1;
      --accent:    #A8C5A0;
      --gold:      #C8B07A;
      --danger:    #C97070;
      --radius:    14px;
      --radius-sm: 10px;
      --transition: .25s cubic-bezier(.4,0,.2,1);
      --font-serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      --font-sans:  'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { touch-action: manipulation; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Login Screen ── */
    .login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .login-screen.hidden { display:none; }
    .login-logo { font-family:var(--font-serif); font-size:34px; font-weight:700; letter-spacing:4px; margin-bottom:6px; }
    .login-sub  { font-size:13px; color:var(--cream-dim); margin-bottom:32px; }
    .login-box {
      width: 100%;
      max-width: 340px;
    }
    .login-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 15px;
      color: var(--cream);
      margin-bottom: 14px;
      font-family: inherit;
      transition: var(--transition);
    }
    .login-box input:focus { outline:none; border-color:var(--pink); box-shadow:0 0 0 3px rgba(201,164,160,.2); }
    .login-error { color:var(--danger); font-size:13px; margin-bottom:10px; display:none; }

    /* ── Admin Panel ── */
    .admin-panel { display:none; }
    .admin-panel.visible { display:block; }

    /* Header */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: sticky; top:0; z-index:50;
      background: var(--bg);
    }
    .admin-header__left { display:flex; align-items:center; gap:12px; }
    .admin-header__logo { font-family:var(--font-serif); font-size:22px; font-weight:700; letter-spacing:3px; }
    .admin-header__tag {
      font-size: 11px;
      background: var(--pink);
      color: #fff;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 600;
    }
    .admin-header__actions { display:flex; gap:8px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      padding: 10px 16px;
      font-family: inherit;
    }
    .btn:active { transform:scale(.96); }
    .btn--primary { background:var(--pink); color:#fff; }
    .btn--primary:hover { background:var(--pink-light); }
    .btn--outline { background:transparent; border:1px solid rgba(255,255,255,.15); color:var(--cream); }
    .btn--outline:hover { border-color:rgba(255,255,255,.3); }
    .btn--danger  { background:transparent; border:1px solid rgba(201,112,112,.3); color:var(--danger); }
    .btn--danger:hover { background:rgba(201,112,112,.1); }
    .btn--sm { padding:6px 12px; font-size:12px; }
    .btn--lg { padding:14px 20px; font-size:15px; width:100%; border-radius:var(--radius); }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar__count { font-size:14px; color:var(--cream-dim); }

    /* Product list */
    .product-list {
      padding: 0 20px 100px;
    }
    .product-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.06);
      transition: var(--transition);
      cursor: grab;
    }
    .product-row:active { cursor:grabbing; }
    .product-row.dragging {
      opacity: .5;
      transform: scale(.97);
    }
    .product-row.drag-over {
      border-color: var(--pink);
      box-shadow: 0 0 0 2px rgba(201,164,160,.3);
    }
    .product-row__order {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }
    .btn-arrow {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
      color: var(--cream-dim);
      font-size: 10px;
      width: 26px;
      height: 22px;
      border-radius: 5px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-arrow:active { background: var(--pink); color:#fff; }
    .btn-arrow:disabled { opacity:.2; cursor:default; }
    .product-row__img {
      width: 56px; height: 56px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .product-row__info { flex:1; min-width:0; }
    .product-row__name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-row__meta {
      font-size: 12px;
      color: var(--cream-dim);
      margin-top: 2px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .product-row__price { color:var(--pink-light); font-weight:600; letter-spacing:.3px; }
    .product-row__actions { display:flex; gap:6px; flex-shrink:0; }

    .badge-sm {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .badge-sm--hit    { background:var(--pink);   color:#fff; }
    .badge-sm--season { background:var(--accent);  color:#2a3a2a; }
    .badge-sm--new    { background:var(--gold);    color:#2a2a1a; }

    /* ── Modal / Form ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display:flex; }

    .modal {
      background: var(--bg-light);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px 20px 32px;
      animation: slideUp .3s ease;
    }
    @keyframes slideUp {
      from { transform:translateY(100%); opacity:0; }
      to   { transform:translateY(0); opacity:1; }
    }
    .modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal__title { font-family:var(--font-serif); font-size:20px; font-weight:700; }
    .modal__close {
      background: none; border:none; color:var(--cream-dim);
      font-size: 24px; cursor:pointer; padding:4px;
    }
    .modal__close:hover { color:var(--cream); }

    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }
    .field__label {
      font-size: 12px;
      font-weight: 600;
      color: var(--cream-dim);
      margin-bottom: 5px;
      letter-spacing: .3px;
    }
    .field input,
    .field select,
    .field textarea {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 14px;
      color: var(--cream);
      font-family: inherit;
      transition: var(--transition);
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(201,164,160,.2);
    }
    .field textarea { resize:vertical; min-height:60px; }
    .field select {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg fill='%23EDE6DA' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 18px;
    }
    .field-row { display:flex; gap:12px; }
    .field-row .field { flex:1; }

    /* Checkboxes */
    .checkbox-group {
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .checkbox-pill {
      cursor: pointer;
    }
    .checkbox-pill input { display:none; }
    .checkbox-pill span {
      display: block;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 13px;
      font-weight: 600;
      color: var(--cream-dim);
      transition: var(--transition);
    }
    .checkbox-pill input:checked + span {
      background: var(--pink);
      color: #fff;
      border-color: var(--pink);
    }

    /* Image preview */
    .img-preview {
      width: 100%;
      height: 140px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      margin-top: 8px;
      display: none;
      border: 1px solid rgba(255,255,255,.08);
    }
    .img-preview.visible { display:block; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(12px);
      color: var(--cream);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: var(--transition);
      z-index: 999;
      pointer-events: none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* Confirm dialog */
    .confirm-overlay {
      position: fixed; inset:0;
      background: rgba(0,0,0,.6);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .confirm-overlay.open { display:flex; }
    .confirm-box {
      background: var(--bg-light);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    .confirm-box__text { font-size:15px; margin-bottom:20px; line-height:1.5; }
    .confirm-box__actions { display:flex; gap:10px; }
    .confirm-box__actions .btn { flex:1; }

    /* ── Import/Export bar ── */
    .io-bar {
      display: flex;
      gap: 8px;
      padding: 0 20px 12px;
    }
    #importFile { display:none; }

    /* ── Category list ── */
    .cat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .cat-row:last-child { border-bottom:none; }
    .cat-row__id { font-size:11px; color:var(--cream-dim); min-width:70px; }
    .cat-row__name { flex:1; font-size:14px; font-weight:500; }
    .cat-row__del {
      background:none; border:none; color:var(--danger);
      font-size:16px; cursor:pointer; padding:4px 8px;
      border-radius:6px; transition:var(--transition);
    }
    .cat-row__del:active { background:rgba(201,112,112,.15); }

    /* ── Badge list ── */
    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .badge-row:last-child { border-bottom:none; }
    .badge-row__dot {
      width: 14px; height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .badge-row__id { font-size:11px; color:var(--cream-dim); min-width:50px; }
    .badge-row__name { flex:1; font-size:14px; font-weight:500; }
    .badge-row__del {
      background:none; border:none; color:var(--danger);
      font-size:16px; cursor:pointer; padding:4px 8px;
      border-radius:6px; transition:var(--transition);
    }
    .badge-row__del:active { background:rgba(201,112,112,.15); }

    /* ── Promo fields fix ── */
    .field input,
    .field textarea,
    .field select { max-width:100%; }
    .field-row { min-width:0; }

    /* ── Image upload zone ── */
    .img-zone {
      position: relative;
      border: 2px dashed rgba(255,255,255,.15);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      margin-top: 4px;
    }
    .img-zone:hover, .img-zone.drag-over {
      border-color: var(--pink);
      background: rgba(201,164,160,.08);
    }
    .img-zone__placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 28px 20px;
      color: var(--cream-dim);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
    .img-zone__icon { opacity: .5; margin-bottom: 2px; }
    .img-zone__hint { font-size: 11px; opacity: .65; margin-top: 2px; }
    .img-zone__preview {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: none;
    }
    .img-zone__clear {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.15);
      color: #fff;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      display: none;
    }
    .img-zone.has-img .img-zone__placeholder { display: none; }
    .img-zone.has-img .img-zone__clear { display: block; }
    .img-zone.has-img { border-style: solid; border-color: rgba(255,255,255,.1); }
    .img-zone.has-img .img-zone__preview { display: block; }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      gap: 4px;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: none;
      color: var(--cream-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
    }
    .tab-btn:hover { color: var(--cream); }
    .tab-btn.active {
      background: rgba(201,164,160,.14);
      border-color: rgba(201,164,160,.28);
      color: var(--cream);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 16px 20px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--radius);
      padding: 16px;
    }
    .stat-card__label {
      font-size: 11px;
      font-weight: 600;
      color: var(--cream-dim);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .stat-card__value {
      font-size: 26px;
      font-weight: 800;
      color: var(--cream);
      line-height: 1;
    }
    .stat-card__sub {
      font-size: 11px;
      color: var(--cream-dim);
      margin-top: 4px;
    }
    .stat-card--warn .stat-card__value { color: var(--gold); }
    .stat-card--danger .stat-card__value { color: var(--danger); }
    .stat-card--accent .stat-card__value { color: var(--accent); }
    .stats-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--cream-dim);
      padding: 4px 20px 8px;
    }
    .cat-stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .cat-stat-row:last-child { border-bottom: none; }
    .cat-stat-row__name { flex: 1; font-size: 14px; font-weight: 500; }
    .cat-stat-row__count { font-size: 13px; color: var(--cream-dim); }
    .cat-stat-bar {
      width: 80px;
      height: 4px;
      background: rgba(255,255,255,.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .cat-stat-bar__fill {
      height: 100%;
      background: var(--pink);
      border-radius: 2px;
      transition: width .4s ease;
    }
    .seg-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .seg-row:last-child { border-bottom: none; }
    .seg-row__label { flex: 1; font-size: 13px; font-weight: 500; }
    .seg-row__bar {
      width: 100px; height: 6px;
      background: rgba(255,255,255,.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .seg-row__meta { font-size: 12px; color: var(--cream-dim); min-width: 60px; text-align: right; }

    /* ── Responsive ── */
    @media (min-width: 600px) {
      .modal {
        border-radius: var(--radius);
        margin: auto;
        max-height: 85vh;
      }
      .modal-overlay { align-items:center; }
    }
  </style>
</head>
<body>

  <!-- ====== LOGIN ====== -->
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">ИВА</div>
    <div class="login-sub">Админ-панель</div>
    <div class="login-box">
      <input type="password" id="loginPass" placeholder="Пароль" autofocus>
      <div class="login-error" id="loginError">Неверный пароль</div>
      <button class="btn btn--primary btn--lg" id="loginBtn">Войти</button>
    </div>
  </div>

  <!-- ====== ADMIN PANEL ====== -->
  <div class="admin-panel" id="adminPanel">

    <header class="admin-header">
      <div class="admin-header__left">
        <span class="admin-header__logo">ИВА</span>
        <span class="admin-header__tag">Админ</span>
      </div>
      <div class="admin-header__actions">
        <a href="index.html" class="btn btn--outline btn--sm" target="_blank">Витрина</a>
        <button class="btn btn--outline btn--sm" id="logoutBtn">Выйти</button>
      </div>
    </header>

    <!-- ====== Вкладки ====== -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="products">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22c-4-3-8-7.5-8-12a8 8 0 0 1 16 0c0 4.5-4 9-8 12Z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Букеты
      </button>
      <button class="tab-btn" data-tab="settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
        Настройки
      </button>
      <button class="tab-btn" data-tab="stats">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
          <line x1="2"  y1="20" x2="22" y2="20"/>
        </svg>
        Статистика
      </button>
    </nav>

    <!-- ── Вкладка: Букеты ── -->
    <div class="tab-panel active" id="tab-products">
      <div class="toolbar">
        <div>
          <span class="toolbar__count" id="productCount"></span>
          <span id="syncStatus" style="font-size:12px;margin-left:10px"></span>
        </div>
        <button class="btn btn--primary" id="addProductBtn">+ Добавить товар</button>
      </div>

      <div class="io-bar">
        <button class="btn btn--outline btn--sm" id="exportBtn">Экспорт Excel</button>
        <button class="btn btn--outline btn--sm" id="importBtn">Импорт Excel</button>
        <input type="file" id="importFile" accept=".xlsx,.xls">
        <button class="btn btn--danger btn--sm" id="resetBtn">Сбросить к исходным</button>
        <button class="btn btn--outline btn--sm" id="tokenBtn">Токен</button>
      </div>

      <!-- Token editor (hidden by default) -->
      <div style="padding:0 20px 12px;display:none" id="tokenPanel">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:14px 16px;border:1px solid rgba(255,255,255,.06);overflow:hidden">
          <div style="font-size:12px;font-weight:600;color:var(--cream-dim);margin-bottom:6px">GitHub Token</div>
          <div style="display:flex;gap:8px">
            <input type="text" id="tokenInput" placeholder="ghp_... или github_pat_..." style="flex:1;background:var(--bg-light);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--cream);font-family:monospace;width:100%">
            <button class="btn btn--primary btn--sm" id="tokenSaveBtn" style="flex-shrink:0">Сохранить</button>
          </div>
        </div>
      </div>

      <div class="product-list" id="productList"></div>
    </div>

    <!-- ── Вкладка: Настройки ── -->
    <div class="tab-panel" id="tab-settings">

      <!-- Promo editor -->
      <div style="padding:16px 20px 0;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid rgba(255,255,255,.06);overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <span style="font-size:14px;font-weight:600">Промо-баннер</span>
            <button class="btn btn--outline btn--sm" id="promoSaveBtn">Сохранить</button>
          </div>
          <div class="field-row">
            <label class="field" style="flex:0 0 70px;min-width:0">
              <span class="field__label">Эмоджи</span>
              <input type="text" id="promoEmoji" value="🌿" maxlength="4" style="text-align:center;width:100%">
            </label>
            <label class="field" style="min-width:0">
              <span class="field__label">Заголовок</span>
              <input type="text" id="promoTitle" value="Букет дня" style="width:100%">
            </label>
          </div>
          <label class="field" style="margin-bottom:0">
            <span class="field__label">Описание</span>
            <input type="text" id="promoText" value="Нежный минимал — сегодня со скидкой" style="width:100%">
          </label>
        </div>
      </div>

      <!-- Category editor -->
      <div style="padding:12px 20px 0;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid rgba(255,255,255,.06);overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <span style="font-size:14px;font-weight:600">Категории</span>
          </div>
          <div id="catList"></div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input type="text" id="newCatInput" placeholder="Новая категория" style="flex:1;background:var(--bg-light);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--cream);font-family:inherit;width:100%">
            <button class="btn btn--primary btn--sm" id="addCatBtn" style="flex-shrink:0">Добавить</button>
          </div>
        </div>
      </div>

      <!-- Badge editor -->
      <div style="padding:12px 20px 20px;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid rgba(255,255,255,.06);overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <span style="font-size:14px;font-weight:600">Бейджи</span>
          </div>
          <div id="badgeList"></div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input type="text" id="newBadgeInput" placeholder="Новый бейдж" style="flex:1;background:var(--bg-light);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--cream);font-family:inherit;width:100%">
            <input type="color" id="newBadgeColor" value="#C9A4A0" style="width:40px;height:38px;border:none;border-radius:var(--radius-sm);cursor:pointer;background:transparent">
            <button class="btn btn--primary btn--sm" id="addBadgeBtn" style="flex-shrink:0">Добавить</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Вкладка: Статистика ── -->
    <div class="tab-panel" id="tab-stats">
      <div id="statsPanel"></div>
    </div>

  </div>

  <!-- ====== MODAL: Add / Edit Product ====== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modalTitle">Добавить товар</h2>
        <button class="modal__close" id="modalClose">&times;</button>
      </div>
      <form id="productForm">
        <input type="hidden" name="id" id="fId">

        <label class="field">
          <span class="field__label">Название</span>
          <input type="text" name="name" id="fName" placeholder="Букет весенний" required>
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field__label">Цена (руб.)</span>
            <input type="number" name="price" id="fPrice" placeholder="3500" min="0" required>
          </label>
          <label class="field">
            <span class="field__label">Остаток (шт.)</span>
            <input type="number" name="stock" id="fStock" placeholder="10" min="0">
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field__label">Популярность (1-10)</span>
            <input type="number" name="popular" id="fPopular" placeholder="5" min="1" max="10">
          </label>
          <div class="field"></div>
        </div>

        <div class="field-row">
          <label class="field">
            <span class="field__label">Категория</span>
            <select name="category" id="fCategory"></select>
          </label>
          <label class="field">
            <span class="field__label">Бейдж</span>
            <select name="badge" id="fBadge"></select>
          </label>
        </div>

        <label class="field">
          <span class="field__label">Описание</span>
          <textarea name="desc" id="fDesc" placeholder="Краткое описание товара..."></textarea>
        </label>

        <div class="field">
          <span class="field__label">Размеры</span>
          <div class="checkbox-group">
            <label class="checkbox-pill"><input type="checkbox" name="sizeS" id="fSizeS"><span>S</span></label>
            <label class="checkbox-pill"><input type="checkbox" name="sizeM" id="fSizeM"><span>M</span></label>
            <label class="checkbox-pill"><input type="checkbox" name="sizeL" id="fSizeL"><span>L</span></label>
          </div>
        </div>

        <div class="field">
          <span class="field__label">Фото</span>
          <div class="img-zone" id="imgZone">
            <input type="file" id="imgFileInput" accept="image/*" style="display:none">
            <div class="img-zone__placeholder">
              <svg class="img-zone__icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span>Перетащи фото или нажми для выбора</span>
              <span class="img-zone__hint">JPG / PNG · сжимается автоматически</span>
            </div>
            <img class="img-zone__preview" id="imgPreview" alt="preview">
            <button type="button" class="img-zone__clear" id="imgClearBtn">✕ Убрать</button>
          </div>
          <input type="url" name="img" id="fImg" placeholder="или вставь ссылку на фото…" style="margin-top:8px">
        </div>

        <button type="submit" class="btn btn--primary btn--lg" id="formSubmitBtn">Сохранить</button>
      </form>
    </div>
  </div>

  <!-- ====== CONFIRM DIALOG ====== -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-box__text" id="confirmText"></div>
      <div class="confirm-box__actions">
        <button class="btn btn--outline" id="confirmCancel">Отмена</button>
        <button class="btn btn--danger" id="confirmOk">Удалить</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="data.js?v=4"></script>
  <script src="admin.js?v=4"></script>
</body>
</html>
