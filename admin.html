<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IVA — Админ-панель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #3D4F4C;
    --bg-card: rgba(0,0,0,.22);
    --cream: #EDE6DA;
    --cream-dim: rgba(237,230,218,.55);
    --pink: #C9A4A0;
    --accent: #A8C5A0;
    --gold: #C8B07A;
    --danger: #C97070;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--cream);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .login {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
  }
  .login h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 6px;
  }
  .login .sub { color: var(--cream-dim); font-size: 14px; }
  .login .box {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 360px;
    margin-top: 16px;
  }
  .input {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--cream);
    font-size: 15px;
    font-family: inherit;
    width: 100%;
  }
  .input::placeholder { color: rgba(255,255,255,.4); }
  .btn {
    background: var(--pink);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn--secondary {
    background: transparent;
    border: 1px solid rgba(255,255,255,.18);
    color: var(--cream);
  }
  .btn--danger { background: var(--danger); }
  .error { color: #ff9090; font-size: 13px; min-height: 18px; }
  .app { display: none; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar__title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .topbar__title small {
    font-family: 'Manrope', sans-serif;
    background: var(--pink);
    color: #fff;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .topbar__actions { display: flex; gap: 10px; align-items: center; }
  .sync-status {
    font-size: 12px;
    color: var(--cream-dim);
    padding: 4px 10px;
    border-radius: 8px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 8px 22px 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent;
    border: none;
    color: var(--cream-dim);
    padding: 12px 18px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--cream); }
  .tab.active {
    color: var(--cream);
    border-bottom-color: var(--pink);
  }
  .toolbar {
    padding: 16px 22px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar .input { max-width: 320px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 0 22px 60px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card__img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: rgba(255,255,255,.04);
  }
  .card__noimg {
    width: 100%;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.35);
    font-size: 12px;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .card__body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card__title { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .card__sub { font-size: 12px; color: var(--cream-dim); }
  .card__price { color: var(--pink); font-weight: 700; }
  .card__actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }
  .card__actions .btn { flex: 1; padding: 8px 12px; font-size: 13px; }
  .card__badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--gold);
    color: #2a2a1a;
    letter-spacing: .5px;
    text-transform: uppercase;
    width: fit-content;
  }
  .card__badge--hidden {
    background: var(--danger);
    color: #fff;
    font-size: 13px;
    padding: 5px 12px;
    letter-spacing: 1px;
  }
  .card { position: relative; }
  .card.is-hidden .card__img,
  .card.is-hidden .card__noimg,
  .card.is-hidden .card__body > *:not(.card__actions) { opacity: .5; }
  .card.is-hidden::after {
    content: "Скрыто";
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 2;
  }
  .card.is-selected {
    border-color: var(--pink);
    box-shadow: 0 0 0 2px var(--pink);
  }
  .card__select {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: rgba(0,0,0,.5);
    border: 2px solid #fff;
    cursor: pointer;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 16px;
    font-weight: 700;
    transition: background .15s;
  }
  .card.is-selected .card__select {
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }
  .bulk-bar {
    position: sticky;
    top: 60px;
    z-index: 50;
    background: var(--pink);
    color: #fff;
    padding: 10px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }
  .bulk-bar__count { font-weight: 700; }
  .bulk-bar button {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    color: #fff;
    border-radius: 8px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .bulk-bar button:hover { background: rgba(255,255,255,.28); }
  .bulk-bar__clear {
    margin-left: auto;
    background: transparent !important;
    border-color: rgba(255,255,255,.5) !important;
  }

  /* Toggle-switch checkbox (для "скрыть из каталога") */
  .toggle-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-field__label { flex: 1; }
  .toggle-field__title {
    font-size: 14px;
    font-weight: 600;
    color: var(--cream);
  }
  .toggle-field__hint {
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 2px;
  }
  .switch {
    position: relative;
    width: 50px;
    height: 28px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0; height: 0;
    position: absolute;
  }
  .switch__slider {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.15);
    border-radius: 28px;
    transition: background .2s;
    cursor: pointer;
  }
  .switch__slider::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .switch input:checked + .switch__slider { background: var(--danger); }
  .switch input:checked + .switch__slider::before { transform: translateX(22px); }

  /* === Custom-template editor (полная страница) === */
  .cust-editor { max-width: 1400px; margin: 0 auto; }
  .cust-editor--wide { display: flex; flex-direction: column; gap: 16px; }
  /* Три колонки: фото | состав | компоненты */
  .cust-3col {
    display: grid; gap: 16px;
    grid-template-columns: minmax(260px, 1fr) minmax(280px, 1.2fr) minmax(280px, 1.4fr);
    align-items: start;
  }
  @media (max-width: 1100px) {
    .cust-3col { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 700px) {
    .cust-3col { grid-template-columns: 1fr; }
  }
  /* Под колонками — 2-колоночная сетка для базовых полей */
  .cust-bottom-grid {
    display: grid; gap: 16px;
    grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 700px) {
    .cust-bottom-grid { grid-template-columns: 1fr; }
  }
  /* Колонка-результатов — в одну колонку (узкая) */
  .cust-results--col { grid-template-columns: 1fr; max-height: 520px; }

  /* Скролл внутри секции состава и компонентов */
  .cust-3col .cust-section {
    max-height: calc(100vh - 220px);
    display: flex; flex-direction: column;
  }
  .cust-3col .cust-items,
  .cust-3col .cust-results {
    overflow-y: auto;
    flex: 1; min-height: 0;
    padding-right: 4px;
  }
  /* Симпатичный скроллбар */
  .cust-3col .cust-items::-webkit-scrollbar,
  .cust-3col .cust-results::-webkit-scrollbar { width: 6px; }
  .cust-3col .cust-items::-webkit-scrollbar-thumb,
  .cust-3col .cust-results::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.15); border-radius: 3px;
  }
  /* Фото колонка — фиксированная высота не нужна, но не растягиваем */
  .cust-3col .cust-section--photo { max-height: none; }

  /* Обертка списка шаблонов с отступами */
  .cust-list-wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 24px;
  }
  @media (max-width: 600px) {
    .cust-list-wrap { padding: 12px 16px; }
  }


  /* Быстрые кнопки наценки */
  .cust-pricebtn {
    padding: 6px 12px; border-radius: 8px;
    background: rgba(201,164,160,.15); color: var(--pink-light);
    border: 1px solid rgba(201,164,160,.3); cursor: pointer;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    transition: all .15s;
  }
  .cust-pricebtn:hover { background: var(--pink); color: #2a1f1d; }
  .cust-editor__top {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 0; margin-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: sticky; top: 64px;
    background: var(--bg);
    z-index: 10;
  }
  .cust-editor__grid {
    display: grid; gap: 20px;
    grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 900px) {
    .cust-editor__grid { grid-template-columns: 1fr; }
  }
  .cust-editor__col { display: flex; flex-direction: column; gap: 16px; }
  .cust-section {
    background: rgba(255,255,255,.04);
    border-radius: 12px;
    padding: 16px;
  }
  .cust-section__title {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--cream-dim); margin-bottom: 10px;
  }
  .cust-editor__bottom {
    display: flex; gap: 10px;
    margin-top: 24px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.08);
    position: sticky; bottom: 0;
    background: var(--bg); padding-bottom: 16px;
  }

  /* Фото */
  .cust-photo {
    position: relative;
    width: 100%; aspect-ratio: 4/3;
    background: rgba(0,0,0,.2); border-radius: 12px; overflow: hidden;
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .cust-photo img { width: 100%; height: 100%; object-fit: cover; }
  .cust-photo__placeholder {
    color: var(--cream-dim); font-size: 14px;
  }
  .cust-photo__remove {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(0,0,0,.7); color: #fff;
    border: none; cursor: pointer; font-size: 20px; line-height: 1; padding: 0;
  }
  .cust-dropzone {
    border: 2px dashed rgba(255,255,255,.18);
    border-radius: 10px; padding: 14px; text-align: center;
    cursor: pointer; transition: all .2s;
  }
  .cust-dropzone:hover, .cust-dropzone.drag {
    border-color: var(--pink); background: rgba(201,164,160,.08);
  }

  /* Состав */
  .cust-items { display: flex; flex-direction: column; gap: 6px; }
  .ci-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; background: rgba(255,255,255,.04);
    border-radius: 10px;
  }
  .ci-row__title { flex: 1; min-width: 0; }
  .ci-row__qty {
    display: flex; align-items: center; gap: 0;
    background: rgba(0,0,0,.25); border-radius: 8px; overflow: hidden;
  }
  .ci-minus, .ci-plus {
    width: 32px; height: 32px; border: none; background: transparent;
    color: var(--cream); font-size: 18px; cursor: pointer;
  }
  .ci-minus:hover, .ci-plus:hover { background: rgba(255,255,255,.1); }
  .ci-qty {
    width: 44px; height: 32px; padding: 0; border: none;
    background: transparent; color: var(--cream);
    text-align: center; font-size: 14px; font-weight: 600;
  }
  .ci-del {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,80,80,.15); color: #ff8585;
    border: none; cursor: pointer; font-size: 18px; line-height: 1;
  }
  .ci-del:hover { background: rgba(255,80,80,.3); }

  /* Чипы категорий */
  .cust-chips {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin: 10px 0;
  }
  .cust-chip {
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.06); color: var(--cream);
    border: 1px solid transparent; cursor: pointer;
    font-size: 12px; font-weight: 500;
    transition: all .15s;
  }
  .cust-chip:hover { background: rgba(255,255,255,.12); }
  .cust-chip.active {
    background: var(--pink); color: #2a1f1d; border-color: var(--pink);
  }

  /* Результаты поиска */
  .cust-results {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    max-height: 380px; overflow-y: auto;
    padding-right: 6px;
  }
  @media (max-width: 600px) {
    .cust-results { grid-template-columns: 1fr; }
  }
  .cust-result {
    display: grid;
    grid-template-columns: 1fr 24px;
    grid-template-areas: "title action" "sub action";
    align-items: center; gap: 2px 8px;
    padding: 10px; border-radius: 8px;
    background: rgba(255,255,255,.04);
    border: 1px solid transparent; cursor: pointer;
    text-align: left; transition: all .15s;
    color: var(--cream); font-family: inherit;
  }
  .cust-result:hover {
    background: rgba(201,164,160,.12);
    border-color: rgba(201,164,160,.4);
  }
  .cust-result.added {
    background: rgba(58,107,64,.2);
    border-color: rgba(58,107,64,.6);
  }
  .cust-result__title { grid-area: title; font-size: 13px; font-weight: 600; line-height: 1.2; }
  .cust-result__sub { grid-area: sub; font-size: 11px; color: var(--cream-dim); }
  .cust-result__action {
    grid-area: action;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,.1); color: var(--cream);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  .cust-result.added .cust-result__action {
    background: #3a6b40; color: #fff;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #2e3e3c;
    border-radius: 16px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    margin-bottom: 18px;
  }
  .modal .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .modal .row label { font-size: 12px; color: var(--cream-dim); }
  .modal textarea {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px;
    padding: 10px;
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    min-height: 70px;
    resize: vertical;
  }
  .modal__actions { display: flex; gap: 10px; margin-top: 10px; }
  .modal__actions .btn { flex: 1; }
  .img-preview {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
    margin-bottom: 8px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2a28;
    color: var(--cream);
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    opacity: 0;
    transition: opacity .25s;
    z-index: 1000;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .loading { padding: 40px; text-align: center; color: var(--cream-dim); }

  /* === Прогресс-оверлей === */
  .progress-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    display: none; align-items: center; justify-content: center;
    z-index: 2000;
    backdrop-filter: blur(4px);
  }
  .progress-overlay.active { display: flex; }
  .progress-box {
    background: #1f2a28;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 24px 28px;
    min-width: 320px;
    max-width: 90vw;
    box-shadow: 0 12px 48px rgba(0,0,0,.4);
  }
  .progress-label {
    color: var(--cream);
    font-size: 15px;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .progress-counter {
    color: var(--cream-dim);
    font-size: 13px;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  .progress-bar {
    height: 8px;
    background: rgba(255,255,255,.08);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar__fill {
    height: 100%;
    background: linear-gradient(90deg, #c2a5a0, #e0b5ad);
    width: 0%;
    transition: width .15s linear;
    border-radius: 999px;
  }
  /* Indeterminate-режим (когда нет процента — серверная операция) */
  .progress-bar.indeterminate .progress-bar__fill {
    width: 40% !important;
    animation: indet 1.2s linear infinite;
  }
  @keyframes indet {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  .progress-meta {
    display: flex; justify-content: space-between;
    color: var(--cream-dim); font-size: 12px;
    margin-top: 8px; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div class="login" id="loginScreen">
  <h1>ИВА</h1>
  <div class="sub">Админ-панель</div>
  <div class="box">
    <input class="input" id="loginUser" placeholder="Логин" autocomplete="username" value="admin">
    <input class="input" id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" id="loginBtn">Войти</button>

    <div class="progress-bar"><div class="progress-bar__fill" id="progressFill"></div></div>

      <span id="progressPct">0%</span>
      <span id="progressEta"></span>
    </div>

<script>
'use strict';

const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3001' : '';
const AUTH_KEY = 'iva_admin_basic';

function getAuth() { return sessionStorage.getItem(AUTH_KEY); }
function setAuth(u, p) { sessionStorage.setItem(AUTH_KEY, btoa(u + ':' + p)); }
function clearAuth() { sessionStorage.removeItem(AUTH_KEY); }

async function api(method, path, body) {
  const auth = getAuth();
  const res = await fetch(API + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(auth ? { Authorization: 'Basic ' + auth } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { clearAuth(); showLogin(); throw new Error('401'); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function $(s) { return document.querySelector(s); }
function $$(s) { return document.querySelectorAll(s); }

/* === Прогресс с параллелизмом === */
function progressShow(label, total) {
  $('#progressLabel').textContent = label;
  $('#progressCounter').textContent = `0 / ${total}`;
  $('#progressFill').style.width = '0%';
  $('#progressPct').textContent = '0%';
  $('#progressEta').textContent = '';
  $('#progressOverlay').classList.add('active');
}
function progressUpdate(done, total, startedAt) {
  const pct = total ? Math.round(done / total * 100) : 0;
  $('#progressCounter').textContent = `${done} / ${total}`;
  $('#progressFill').style.width = pct + '%';
  $('#progressPct').textContent = pct + '%';
  if (done > 0 && done < total) {
    const elapsed = (Date.now() - startedAt) / 1000;
    const rate = done / elapsed;
    const eta = Math.max(0, Math.round((total - done) / rate));
    $('#progressEta').textContent = eta > 0 ? `осталось ~${eta}с` : '';
  } else {
    $('#progressEta').textContent = '';
  }
}
function progressHide() {
  $('#progressOverlay').classList.remove('active');
  $('.progress-bar').classList.remove('indeterminate');
}

/* Indeterminate-оверлей для серверных операций без точного прогресса */
function progressShowBusy(label, sub = '') {
  $('#progressLabel').textContent = label;
  $('#progressCounter').textContent = sub;
  $('#progressPct').textContent = '';
  $('#progressEta').textContent = '';
  $('.progress-bar').classList.add('indeterminate');
  $('#progressFill').style.width = '40%';
  $('#progressOverlay').classList.add('active');
}

/* Параллельный запуск с concurrency лимитом + прогресс-бар */
async function runWithProgress(label, items, fn, concurrency = 8) {
  if (!items.length) return { done: 0, errors: 0 };
  progressShow(label, items.length);
  const startedAt = Date.now();
  let done = 0, errors = 0;
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const i = idx++;
      try { await fn(items[i], i); }
      catch (e) { errors++; }
      done++;
      progressUpdate(done, items.length, startedAt);
    }
  }
  const workers = Array.from({ length: Math.min(concurrency, items.length) }, worker);
  await Promise.all(workers);
  progressHide();
  return { done, errors };
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function showLogin() {
  $('#loginScreen').style.display = 'flex';
  $('#app').style.display = 'none';
  $('#loginPass').value = '';
  $('#loginError').textContent = '';
}
function showApp() {
  $('#loginScreen').style.display = 'none';
  $('#app').style.display = 'block';
  loadTab(currentTab);
  updateSyncStatus();
  checkSyncUnread();
}

$('#loginBtn').addEventListener('click', doLogin);
$('#loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const u = $('#loginUser').value.trim();
  const p = $('#loginPass').value;
  if (!u || !p) { $('#loginError').textContent = 'Заполни оба поля'; return; }
  setAuth(u, p);
  try {
    await api('GET', '/api/admin/categories');
    showApp();
  } catch (e) {
    clearAuth();
    $('#loginError').textContent = 'Неверный логин/пароль';
  }
}

$('#logoutBtn').addEventListener('click', () => { clearAuth(); showLogin(); });

let currentTab = 'showcase';
let lastData = [];
let selected = new Set();

function sourceForTab(tab) {
  return ({ showcase: 'bouquet', templates: 'spec', stems: 'item', addons: 'item' })[tab];
}

function updateBulkBar() {
  const bar = $('#bulkBar');
  if (selected.size === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  $('#bulkCount').textContent = selected.size;
}

function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  updateBulkBar();
  /* обновляем класс карточки без полного re-render */
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) card.classList.toggle('is-selected', selected.has(id));
}

function clearSelection() {
  selected.clear();
  updateBulkBar();
  $$('.card.is-selected').forEach(c => c.classList.remove('is-selected'));
}

async function bulkSetHidden(hidden) {
  if (selected.size === 0) return;
  const source = sourceForTab(currentTab);
  const ids = [...selected];
  const dataMap = new Map(lastData.map(d => [d.id, d]));
  const label = hidden ? `Скрываю ${ids.length} карточек` : `Показываю ${ids.length} карточек`;
  const { done, errors } = await runWithProgress(label, ids, async (id) => {
    const d = dataMap.get(id);
    const ov = d?._override || {};
    await api('POST', '/api/admin/override', {
      source,
      source_id: id,
      title: ov.title || null,
      description: ov.description || null,
      photo_url: ov.photo_url || null,
      badge: ov.badge || null,
      hidden: hidden ? 1 : 0,
    });
  }, 10);
  toast(errors ? `Обновлено: ${done - errors}/${ids.length}, ошибок: ${errors}` : `Готово: ${done}`);
  clearSelection();
  loadTab(currentTab);
}

$$('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    $('#search').value = '';
    loadTab(currentTab);
  });
});

$('#search').addEventListener('input', () => render());
$('#sort').addEventListener('change', () => render());
$('#visibility').addEventListener('change', () => render());

$('#selectAllBtn').addEventListener('click', () => {
  const visibleIds = [...document.querySelectorAll('.card')].map(c => c.dataset.id);
  const allSelected = visibleIds.every(id => selected.has(id));
  if (allSelected) clearSelection();
  else {
    visibleIds.forEach(id => selected.add(id));
    $$('.card').forEach(c => c.classList.add('is-selected'));
    updateBulkBar();
  }
});

$('#bulkHide').addEventListener('click', () => bulkSetHidden(true));
$('#bulkShow').addEventListener('click', () => bulkSetHidden(false));
$('#bulkClear').addEventListener('click', clearSelection);

/* ========== Плашка с diff-ом синхронизации (вместо TG-уведомления) ========== */
function showSyncDiffPopup(unread) {
  const d = unread.diff;
  const sections = [];
  const block = (icon, label, list, color) => {
    if (!list?.length) return;
    sections.push(`
      <div style="margin-bottom:14px">
        <div style="font-size:13px;font-weight:600;color:${color};margin-bottom:6px">${icon} ${label} (${list.length})</div>
        <div style="display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto">
          ${list.slice(0, 25).map(x => `<div style="font-size:13px;color:var(--cream);padding:4px 8px;background:rgba(255,255,255,.04);border-radius:6px">${escapeHtml(x.title || x.id)}</div>`).join('')}
          ${list.length > 25 ? `<div style="font-size:12px;color:var(--cream-dim);padding:4px 8px">…и ещё ${list.length - 25}</div>` : ''}
        </div>
      </div>`);
  };
  block('🆕', 'Новые шаблоны (черновики)', d.specs_added, '#9ec999');
  block('🆕', 'Новые букеты на витрину (черновики)', d.bouquets_added, '#9ec999');
  block('🗑', 'Удалённые шаблоны', d.specs_removed, '#e8a0a0');
  block('🗑', 'Удалённые букеты', d.bouquets_removed, '#e8a0a0');

  const hint = (d.specs_added?.length || d.bouquets_added?.length)
    ? '<div style="font-size:12px;color:var(--cream-dim);margin-top:10px;padding:10px;background:rgba(232,220,200,.05);border-radius:8px">💡 Новые позиции скрыты от мини-аппки. Добавь фото/название и сними «Скрыть» в редакторе.</div>'
    : '';

  const overlay = document.createElement('div');
  overlay.id = 'syncDiffOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:var(--bg-light, #4A5E5A);border-radius:14px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.5)" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <h3 style="margin:0;font-size:18px">🔄 Синхронизация с Posiflora</h3>
        <span style="font-size:12px;color:var(--cream-dim)">${new Date(unread.finished_at + 'Z').toLocaleString('ru-RU')}</span>
      </div>
      ${sections.join('')}
      ${hint}
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
        <button class="btn btn--primary" id="syncDiffOk">Понял</button>
      </div>
    </div>`;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
  document.getElementById('syncDiffOk').addEventListener('click', async (e) => {
    e.stopPropagation();
    overlay.remove();
    try { await api('POST', '/api/admin/sync/' + unread.id + '/ack'); } catch {}
  });
}

async function checkSyncUnread() {
  try {
    const r = await api('GET', '/api/admin/sync/unread');
    if (r.unread) showSyncDiffPopup(r.unread);
  } catch {}
}

$('#syncBtn').addEventListener('click', async () => {
  $('#syncBtn').disabled = true;
  $('#syncBtn').textContent = 'Синхронизация...';
  progressShowBusy('Синхронизация с Posiflora', 'Тянем шаблоны, букеты, склад...');
  try {
    const r = await api('POST', '/api/admin/sync');
    toast(`Синхронизировано · шаблоны:${r.counts?.specs||0} букеты:${r.counts?.bouquets||0} склад:${r.counts?.items||0}`);
    updateSyncStatus();
    loadTab(currentTab);
    /* Если есть изменения — сразу показать плашку */
    setTimeout(checkSyncUnread, 300);
  } catch (e) {
    toast('Ошибка синхронизации');
  } finally {
    progressHide();
    $('#syncBtn').disabled = false;
    $('#syncBtn').textContent = 'Синхронизация с Posiflora';
  }
});

async function updateSyncStatus() {
  try {
    const hist = await api('GET', '/api/admin/sync/history');
    const last = hist[0];
    if (last) {
      const ago = Math.round((Date.now() - new Date(last.finished_at).getTime()) / 60000);
      $('#syncStatus').textContent = 'Синхронизация ' + ago + ' мин назад · ' + (last.counts.specs||0) + ' шабл, ' + (last.counts.bouquets||0) + ' букетов, ' + (last.counts.items||0) + ' позиций';
    }
  } catch {}
}

async function loadTab(tab) {
  $('#content').innerHTML = '<div class="loading">Загрузка...</div>';
  $('#toolbar').style.display = (tab === 'custom' || tab === 'orders' || tab === 'miniapp') ? 'none' : '';
  try {
    if (tab === 'showcase') lastData = await api('GET', '/api/admin/bouquets?status=demonstrated');
    else if (tab === 'templates') lastData = await api('GET', '/api/admin/specs');
    else if (tab === 'custom') { renderCustomTemplates(); return; }
    else if (tab === 'stems') {
      const all = await api('GET', '/api/admin/inventory');
      lastData = all.filter(i => ['Цветы','Зелень','Сухоцветы'].includes(i.category_title));
    }
    else if (tab === 'addons') {
      const all = await api('GET', '/api/admin/inventory');
      lastData = all.filter(i => i.category_title && !['Цветы','Зелень','Сухоцветы'].includes(i.category_title));
    }
    else if (tab === 'orders') { renderOrders(); return; }
    else if (tab === 'miniapp') { renderMiniappSettings(); return; }
  } catch (e) {
    $('#content').innerHTML = '<div class="loading">Ошибка: ' + e.message + '</div>';
    return;
  }

  const overrides = await api('GET', '/api/admin/overrides').catch(() => []);
  const sourceMap = { showcase: 'bouquet', templates: 'spec', stems: 'item', addons: 'item' };
  const sourceKey = sourceMap[tab];
  const ovMap = new Map(overrides.filter(o => o.source === sourceKey).map(o => [o.source_id, o]));

  lastData = lastData.map(d => {
    const ov = ovMap.get(d.id);
    return Object.assign({}, d, { _override: ov || null });
  });

  render();
}

function getPrice(d) {
  if (currentTab === 'showcase') return d.price || d.true_sale_amount || d.sale_amount || 0;
  if (currentTab === 'templates') return d.min_price || d.max_price || 0;
  return d.price_max || 0;
}

function render() {
  const q = $('#search').value.toLowerCase().trim();
  const sort = $('#sort').value;
  const vis = $('#visibility').value;

  let filtered = lastData.slice();
  if (q) filtered = filtered.filter(d => (d.title || '').toLowerCase().includes(q));
  if (vis === 'hidden')  filtered = filtered.filter(d => d._override && d._override.hidden);
  if (vis === 'visible') filtered = filtered.filter(d => !d._override || !d._override.hidden);
  if (vis === 'no_photo') filtered = filtered.filter(d => !d._override || !d._override.photo_url);

  if (sort === 'title') filtered.sort((a,b) => (a.title||'').localeCompare(b.title||'', 'ru'));
  else if (sort === 'price_asc') filtered.sort((a,b) => getPrice(a) - getPrice(b));
  else if (sort === 'price_desc') filtered.sort((a,b) => getPrice(b) - getPrice(a));
  else if (sort === 'hidden_first') filtered.sort((a,b) => ((b._override?.hidden?1:0) - (a._override?.hidden?1:0)));

  $('#counter').textContent = filtered.length + ' из ' + lastData.length;

  // Для stems/addons — общая сумма штук
  if ((currentTab === 'stems' || currentTab === 'addons') && filtered.some(d => d.available != null)) {
    const total = filtered.reduce((s, d) => s + (+d.available || 0), 0);
    const positionsWithStock = filtered.filter(d => +d.available > 0).length;
    $('#counter').textContent = `${filtered.length} позиций · всего ${total.toLocaleString('ru-RU')} шт · в наличии ${positionsWithStock}`;
  }

  if (!filtered.length) {
    $('#content').innerHTML = '<div class="loading">Ничего не найдено</div>';
    return;
  }

  $('#content').innerHTML = '<div class="grid">' + filtered.map(renderCard).join('') + '</div>';
  $$('.js-edit').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openEditor(b.dataset.id); }));
  $$('.card__select').forEach(sel => sel.addEventListener('click', e => {
    e.stopPropagation();
    toggleSelect(sel.dataset.id);
  }));
}

function renderCard(d) {
  const ov = d._override;
  const photo = ov && ov.photo_url;
  const title = (ov && ov.title) || d.title || '—';
  let sub = '';
  let subHTML = '';
  if (currentTab === 'showcase') sub = (d.price || d.true_sale_amount || d.sale_amount || 0) + ' ₽ · ' + (d.on_window_at||'').slice(0,10);
  else if (currentTab === 'templates') sub = (d.min_price||0) + '–' + (d.max_price||0) + ' ₽ · ' + (d.status||'');
  else {
    // Posiflora не отдаёт qty в API → показываем число если есть, иначе только категорию + цену
    if (d.available != null && d.available > 0) {
      subHTML = `${escapeHtml(d.category_title || '')} · <span style="color:#9ec999;font-weight:700">${d.available} шт</span> · до ${d.price_max||0} ₽`;
    } else {
      sub = `${d.category_title || ''} · до ${d.price_max||0} ₽`;
    }
  }
  const badge = ov && ov.badge ? '<span class="card__badge">' + ov.badge + '</span>' : '';
  const isHidden = ov && ov.hidden;
  const isSelected = selected.has(d.id);

  return '<div class="card' + (isHidden ? ' is-hidden' : '') + (isSelected ? ' is-selected' : '') + '" data-id="' + d.id + '">'
    + '<div class="card__select" data-id="' + d.id + '">✓</div>'
    + (photo ? '<img class="card__img" src="' + photo + '" alt="">' : '<div class="card__noimg">Нет фото</div>')
    + '<div class="card__body">'
    + '<div class="card__title">' + escapeHtml(title) + '</div>'
    + '<div class="card__sub">' + (subHTML || escapeHtml(sub)) + '</div>'
    + (badge ? '<div style="display:flex;gap:4px">' + badge + '</div>' : '')
    + '<div class="card__actions"><button class="btn js-edit" data-id="' + d.id + '">Редактировать</button></div>'
    + '</div></div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* === Загрузка файлов с прогрессом === */
function uploadFile(file) {
  return new Promise((resolve) => {
    if (!file) return resolve();
    const isHeic = /\.(heic|heif)$/i.test(file.name) || /heic|heif/i.test(file.type);
    if (!file.type.startsWith('image/') && !isHeic) { toast('Только картинки'); return resolve(); }
    if (file.size > 20 * 1024 * 1024) { toast('Макс. 20 МБ'); return resolve(); }

    const xhr = new XMLHttpRequest();
    const fd = new FormData();
    fd.append('file', file);

    progressShow(`Загрузка ${file.name}`, file.size);
    const startedAt = Date.now();

    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) progressUpdate(e.loaded, e.total, startedAt);
    });
    xhr.upload.addEventListener('load', () => {
      // байты ушли — теперь сервер конвертит/жмёт
      progressShowBusy(
        isHeic ? 'Конвертация HEIC → JPEG...' : 'Сжатие фото на сервере...',
        Math.round(file.size / 1024) + ' КБ'
      );
    });
    xhr.addEventListener('load', () => {
      progressHide();
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const data = JSON.parse(xhr.responseText);
          $('#mPhotoUrl').value = data.url || data.path;
          const savedKb = Math.round((data.size || 0) / 1024);
          const origKb = Math.round((data.original_size || file.size) / 1024);
          $('#mUploadStatus').textContent = `Загружено ✓ ${origKb}→${savedKb} КБ`;
          updateImgPreview();
        } catch (e) {
          $('#mUploadStatus').textContent = 'Ошибка парсинга ответа';
        }
      } else {
        $('#mUploadStatus').textContent = `Ошибка HTTP ${xhr.status}`;
      }
      resolve();
    });
    xhr.addEventListener('error', () => {
      progressHide();
      $('#mUploadStatus').textContent = 'Ошибка сети';
      resolve();
    });
    xhr.open('POST', API + '/api/admin/upload');
    xhr.setRequestHeader('Authorization', 'Basic ' + getAuth());
    xhr.send(fd);
  });
}

function customCost() {
  return customDraft.items.reduce((s, it) => {
    const inv = (customInventoryCache || []).find(i => i.id === it.item_id);
    return s + (inv ? (inv.price_max || 0) * (+it.qty || 1) : 0);
  }, 0);
}

function updateCostHint() {
  const sum = customCost();
  const price = +customDraft.price || 0;
  const diff = price - sum;
  const pct = sum > 0 ? Math.round((diff / sum) * 100) : 0;
  const el = $('#cCostHint');
  if (!el) return;
  if (!sum) { el.innerHTML = ''; return; }
  const sign = diff >= 0 ? '+' : '';
  const colorDiff = diff >= 0 ? '#9ec999' : '#ff8080';
  el.innerHTML = `Если поштучно: <b>${sum.toLocaleString('ru-RU')} ₽</b> · Разница: <b style="color:${colorDiff}">${sign}${diff.toLocaleString('ru-RU')} ₽ (${sign}${pct}%)</b>`;
}

/* Категории, из которых реально делают букет — только растения и лента. */
const BOUQUET_CATEGORIES = new Set([
  'Цветы', 'Зелень', 'Сухоцветы', 'Лента',
]);

function renderInventoryPicker(query, category) {
  const allInv = customInventoryCache || [];
  // Фильтр — только то что реально в букете
  const inv = allInv.filter(i => BOUQUET_CATEGORIES.has(i.category_title));
  // Категории — только разрешённые
  const catCounts = {};
  for (const i of inv) catCounts[i.category_title] = (catCounts[i.category_title] || 0) + 1;
  const cats = Object.entries(catCounts).sort((a,b) => b[1]-a[1]).map(c => c[0]);
  $('#cCatChips').innerHTML =
    `<button class="cust-chip ${!category?'active':''}" data-cat="">Все</button>` +
    cats.map(c => `<button class="cust-chip ${category===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)} <span style="opacity:.5">${catCounts[c]}</span></button>`).join('');

  let filtered = inv;
  if (category) filtered = filtered.filter(i => i.category_title === category);
  if (query) {
    const q = query.toLowerCase();
    filtered = filtered.filter(i => (i.title || '').toLowerCase().includes(q));
  }
  filtered = filtered.slice(0, 60);

  const inDraftIds = new Set(customDraft.items.map(i => i.item_id));
  $('#cSearchResults').innerHTML = filtered.length
    ? filtered.map(i => {
        const added = inDraftIds.has(i.id);
        const stock = (i.available != null && i.available > 0)
          ? `<span style="color:#9ec999;font-weight:600">${i.available} шт · </span>`
          : '';
        return `<button class="cust-result ${added?'added':''}" data-id="${i.id}" data-title="${escapeHtml(i.title)}" data-cat="${escapeHtml(i.category_title||'')}">
          <div class="cust-result__title">${escapeHtml(i.title)}</div>
          <div class="cust-result__sub">${stock}${+i.price_max||0} ₽</div>
          <div class="cust-result__action">${added?'✓':'+'}</div>
        </button>`;
      }).join('')
    : '<div style="color:var(--cream-dim);font-size:13px;padding:20px;text-align:center">Ничего не найдено</div>';

  $$('.cust-chip').forEach(el => el.addEventListener('click', () => {
    renderInventoryPicker($('#cSearch').value.trim(), el.dataset.cat);
  }));
  $$('.cust-result').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.id;
    if (customDraft.items.find(x => x.item_id === id)) {
      customDraft.items = customDraft.items.filter(x => x.item_id !== id);
    } else {
      customDraft.items.push({ item_id: id, qty: 1, title: el.dataset.title, category: el.dataset.cat });
    }
    // НЕ перерисовываем всю страницу (иначе скролл слетает) —
    // обновляем только нужные кусочки: состав букета, бейдж + хинт цены, ✓ в пикере
    updateComposition();
    updatePickerBadges();
    updateCostHint();
  }));
}

/* Перерисовать только блок состава букета */
function updateComposition() {
  const d = customDraft;
  const itemsHtml = d.items.length
    ? d.items.map((it, idx) => `
        <div class="ci-row" data-idx="${idx}">
          <div class="ci-row__title">
            <div style="font-weight:600">${escapeHtml(it.title || it.item_id)}</div>
            <div style="font-size:11px;color:var(--cream-dim);margin-top:2px">${escapeHtml(it.category||'')}</div>
          </div>
          <div class="ci-row__qty">
            <button class="ci-minus" data-idx="${idx}">−</button>
            <input type="number" min="1" max="999" value="${it.qty}" data-idx="${idx}" class="ci-qty">
            <button class="ci-plus" data-idx="${idx}">+</button>
          </div>
          <button class="ci-del" data-idx="${idx}">×</button>
        </div>`).join('')
    : '<div style="padding:30px 20px;text-align:center;color:var(--cream-dim);font-size:13px;background:rgba(255,255,255,.03);border-radius:10px">Состав пуст. Выбери компоненты ниже ↓</div>';
  const box = document.querySelector('.cust-items');
  if (box) box.innerHTML = itemsHtml;
  // обновим счётчик в заголовке секции
  const titles = document.querySelectorAll('.cust-section__title');
  for (const t of titles) {
    if (t.textContent.startsWith('Состав букета')) t.textContent = `Состав букета (${d.items.length})`;
  }
  // перепривязать обработчики qty/del
  $$('.ci-qty').forEach(inp => inp.addEventListener('input', e => {
    const i = +e.target.dataset.idx;
    customDraft.items[i].qty = +e.target.value || 1;
    updateCostHint();
    updatePickerBadges();
  }));
  $$('.ci-plus').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.idx; customDraft.items[i].qty++; updateComposition(); updateCostHint(); updatePickerBadges();
  }));
  $$('.ci-minus').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.idx;
    if (customDraft.items[i].qty > 1) { customDraft.items[i].qty--; updateComposition(); updateCostHint(); updatePickerBadges(); }
  }));
  $$('.ci-del').forEach(b => b.addEventListener('click', () => {
    customDraft.items.splice(+b.dataset.idx, 1);
    updateComposition(); updateCostHint(); updatePickerBadges();
  }));
}

/* Обновить статус ✓/+ у карточек пикера БЕЗ перерисовки всей сетки */
function updatePickerBadges() {
  const inDraftIds = new Set(customDraft.items.map(i => i.item_id));
  $$('.cust-result').forEach(card => {
    const has = inDraftIds.has(card.dataset.id);
    card.classList.toggle('added', has);
    const action = card.querySelector('.cust-result__action');
    if (action) action.textContent = has ? '✓' : '+';
  });
}

function bindCustomEditor() {
  const goBack = () => renderCustomTemplates();
  $('#cBack').addEventListener('click', goBack);
  $('#cCancel').addEventListener('click', goBack);

  // Qty controls
  $$('.ci-qty').forEach(inp => inp.addEventListener('input', e => {
    const i = +e.target.dataset.idx;
    customDraft.items[i].qty = +e.target.value || 1;
    updateCostHint();
  }));
  $$('.ci-plus').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.idx; customDraft.items[i].qty++; renderCustomEditor();
  }));
  $$('.ci-minus').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.idx;
    if (customDraft.items[i].qty > 1) { customDraft.items[i].qty--; renderCustomEditor(); }
  }));
  $$('.ci-del').forEach(b => b.addEventListener('click', () => {
    customDraft.items.splice(+b.dataset.idx, 1); renderCustomEditor();
  }));

  // Live cost
  $('#cPrice').addEventListener('input', e => {
    customDraft.price = +e.target.value || 0; updateCostHint();
  });
  // Очищаем нолик при фокусе
  $('#cPrice').addEventListener('focus', e => {
    if (+e.target.value === 0) e.target.value = '';
  });
  // Кнопки быстрой наценки (×2 / ×2.5 / ×3)
  $$('.cust-pricebtn').forEach(b => b.addEventListener('click', () => {
    const cost = customCost();
    if (!cost) { toast('Сначала добавь компоненты'); return; }
    const mult = parseFloat(b.dataset.mult);
    const price = Math.round(cost * mult / 10) * 10; // округление до 10₽
    customDraft.price = price;
    $('#cPrice').value = price;
    updateCostHint();
  }));
  $('#cTitle').addEventListener('input', e => { customDraft.title = e.target.value; });
  $('#cDesc').addEventListener('input', e => { customDraft.description = e.target.value; });
  $('#cHidden').addEventListener('change', e => { customDraft.hidden = e.target.checked; });

  $('#cGenName').addEventListener('click', async () => {
    const items = customDraft.items.filter(i => i.title);
    if (!items.length) { toast('Сначала добавь компоненты'); return; }
    const btn = $('#cGenName');
    const sug = $('#cNameSuggestions');
    btn.disabled = true; btn.textContent = '✨ Думаю...';
    sug.style.display = '';
    sug.innerHTML = '<span style="color:var(--cream-dim);font-size:12px">DeepSeek подбирает варианты...</span>';
    try {
      const r = await api('POST', '/api/admin/generate-name', { items });
      sug.innerHTML = (r.names || []).map(n =>
        `<button type="button" class="btn cust-name-sug" data-name="${escapeHtml(n)}" style="font-size:13px;padding:6px 12px;background:rgba(201,164,160,.15);border:1px solid rgba(201,164,160,.3);color:var(--cream)">${escapeHtml(n)}</button>`
      ).join('');
      sug.querySelectorAll('.cust-name-sug').forEach(b => {
        b.addEventListener('click', () => {
          $('#cTitle').value = b.dataset.name;
          customDraft.title = b.dataset.name;
          sug.style.display = 'none';
        });
      });
    } catch (e) {
      sug.innerHTML = `<span style="color:#e8a0a0;font-size:12px">Ошибка: ${escapeHtml(e.message)}</span>`;
    } finally {
      btn.disabled = false; btn.textContent = '✨ AI';
    }
  });

  // Search
  let searchTimer;
  $('#cSearch').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(() => {
      const activeCat = $('.cust-chip.active')?.dataset.cat || '';
      renderInventoryPicker(q, activeCat);
    }, 100);
  });

  // Photo
  $('#cDropzone').addEventListener('click', () => $('#cFile').click());
  $('#cFile').addEventListener('change', e => uploadCustomPhoto(e.target.files[0]));
  $('#cDropzone').addEventListener('dragover', e => { e.preventDefault(); $('#cDropzone').classList.add('drag'); });
  $('#cDropzone').addEventListener('dragleave', () => $('#cDropzone').classList.remove('drag'));
  $('#cDropzone').addEventListener('drop', e => {
    e.preventDefault(); $('#cDropzone').classList.remove('drag');
    if (e.dataTransfer.files[0]) uploadCustomPhoto(e.dataTransfer.files[0]);
  });
  const removeBtn = $('#cRemovePhoto');
  if (removeBtn) removeBtn.addEventListener('click', async () => {
    const url = customDraft.photo_url;
    customDraft.photo_url = '';
    renderCustomEditor();
    // снести файл с диска
    const m = url.match(/\/uploads\/([^/?#]+)/);
    if (m) {
      try {
        await fetch(API + '/api/admin/upload/' + encodeURIComponent(m[1]), {
          method: 'DELETE', headers: { Authorization: 'Basic ' + getAuth() },
        });
      } catch {}
    }
  });

  // Save
  const doSave = async () => {
    if (!customDraft.title.trim()) { toast('Укажи название'); return; }
    if (!customDraft.items.length) { toast('Добавь хотя бы один компонент'); return; }
    $('#cSave').disabled = true; $('#cSaveTop').disabled = true;
    try {
      await api('POST', '/api/admin/custom-templates', {
        id: customDraft.id,
        title: customDraft.title.trim(),
        description: customDraft.description.trim(),
        photo_url: customDraft.photo_url || null,
        price: customDraft.price,
        hidden: customDraft.hidden ? 1 : 0,
        items: customDraft.items.map(i => ({ item_id: i.item_id, qty: i.qty })),
      });
      toast('Сохранено ✓');
      goBack();
    } catch (e) {
      toast('Ошибка: ' + e.message);
    } finally {
      if ($('#cSave')) { $('#cSave').disabled = false; $('#cSaveTop').disabled = false; }
    }
  };
  $('#cSave').addEventListener('click', doSave);
  $('#cSaveTop').addEventListener('click', doSave);
}

async function uploadCustomPhoto(file) {
  if (!file) return;
  const isImg = file.type.startsWith('image/') || /\.(heic|heif)$/i.test(file.name);
  if (!isImg) { toast('Только картинки'); return; }
  if (file.size > 20 * 1024 * 1024) { toast('Макс 20 МБ'); return; }

  $('#cUpStatus').textContent = '📤 Загрузка ' + Math.round(file.size/1024) + ' КБ...';
  const fd = new FormData(); fd.append('file', file);
  try {
    const res = await fetch(API + '/api/admin/upload', {
      method: 'POST', headers: { Authorization: 'Basic ' + getAuth() }, body: fd,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    customDraft.photo_url = data.url || data.path;
    $('#cUpStatus').textContent = '✓ Загружено';
    renderCustomEditor();
  } catch (e) {
    $('#cUpStatus').textContent = '⚠️ ' + e.message;
  }
}

async function renderOrders() {

      return;
    }
    const html = orders.map(o => {
      const itemsHtml = (o.items || []).map(i => '• ' + escapeHtml(i.name) + ' ×' + i.qty + ' = ' + ((i.price||0) * i.qty).toLocaleString('ru-RU') + ' ₽').join('<br>');
      const delivery = o.delivery_type === 'delivery' ? '🚚 ' + (o.customer_address || '') : '🏪 Самовывоз';
      return '<div style="background:var(--bg-card);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:12px">'
        + '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'
        + '<strong>#' + o.id + ' — ' + escapeHtml(o.customer_name||'') + '</strong>'
        + '<span style="color:var(--cream-dim);font-size:12px">' + new Date(o.created_at).toLocaleString('ru-RU') + '</span>'
        + '</div>'
        + '<div style="color:var(--cream-dim);font-size:13px;margin-bottom:8px">📱 ' + escapeHtml(o.customer_phone||'') + ' · ' + escapeHtml(delivery) + ' · 📅 ' + escapeHtml(o.delivery_date||'') + ' ' + escapeHtml(o.delivery_time||'') + '</div>'
        + '<div style="margin-bottom:8px;font-size:13px">' + itemsHtml + '</div>'
        + '<div style="display:flex;gap:8px;align-items:center">'
        + '<strong style="color:var(--pink)">' + (o.total_price||0).toLocaleString('ru-RU') + ' ₽</strong>'
        + '<span style="background:rgba(255,255,255,.08);padding:3px 10px;border-radius:8px;font-size:12px">' + (o.payment_status || o.status || '') + '</span>'
        + '</div>'

  } catch (e) {
    $('#content').innerHTML = '<div class="loading">Ошибка: ' + e.message + '</div>';
  }
}

    $('#msPreview .ms-preview__title').textContent = $('#msTitle').value || 'Букет дня';
    $('#msPreview .ms-preview__text').textContent = $('#msText').value || '';
    const pct = Number($('#msDiscPercent').value) || 0;
    const en = $('#msDiscEnabled').checked;
    const strip = $('#msStripPreview');
    if (en && pct > 0) {
      strip.style.display = '';
      strip.querySelector('.ms-strip-preview__badge').textContent = '−' + pct + '%';
      strip.querySelector('span:last-child').textContent = $('#msDiscLabel').value || 'Скидка на весь каталог';
    } else {
      strip.style.display = 'none';
    }
  };
  ['msEmoji','msTitle','msText','msDiscPercent','msDiscEnabled','msDiscLabel'].forEach(id => {
    const el = $('#' + id);
    if (el) el.addEventListener('input', upd);
    if (el && el.type === 'checkbox') el.addEventListener('change', upd);
  });

  $('#msAddCode').addEventListener('click', () => {
    _miniappSettings.discount = _miniappSettings.discount || { promocodes: [] };
    _miniappSettings.discount.promocodes = collectCodesFromDom();
    _miniappSettings.discount.promocodes.push({ code: '', percent: 5 });
    drawMiniappSettings();
  });

  document.querySelectorAll('[data-code-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.codeRemove);
      _miniappSettings.discount.promocodes = collectCodesFromDom();
      _miniappSettings.discount.promocodes.splice(idx, 1);
      drawMiniappSettings();
    });
  });

  $('#msReload').addEventListener('click', renderMiniappSettings);

  $('#msTgTest').addEventListener('click', async () => {
    try {
      const r = await api('POST', '/api/orders/notify-test');
      toast(r.ok ? 'Отправлено' : ('Ошибка: ' + (r.reason || 'нет конфига')));
    } catch (e) {
      toast('Ошибка: ' + e.message);
    }
  });

  $('#msSave').addEventListener('click', async () => {
    const body = {
      promo: {
        emoji: $('#msEmoji').value.trim() || '🌿',
        title: $('#msTitle').value.trim() || 'Букет дня',
        text: $('#msText').value.trim(),
        hidden: $('#msHidden').checked,
      },
      discount: {
        enabled: $('#msDiscEnabled').checked,
        percent: Number($('#msDiscPercent').value) || 0,
        label: $('#msDiscLabel').value.trim(),
        promocodes: collectCodesFromDom().filter(c => c.code && c.percent > 0),
      },
      notifications: {
        tg_enabled: $('#msTgEnabled').checked,
        tg_chat_id: $('#msTgChat').value.trim(),
        tg_bot_token: $('#msTgToken').value.trim(),
      },
    };
    try {
      _miniappSettings = await api('PUT', '/api/app-settings', body);
      toast('Сохранено');
      drawMiniappSettings();
    } catch (e) {
      toast('Ошибка: ' + e.message);
    }
  });
}

function collectCodesFromDom() {
  const rows = document.querySelectorAll('#msCodesList .ms-code-row');
  return [...rows].map(row => ({
    code: row.querySelector('[data-code-field="code"]').value.trim().toUpperCase(),
    percent: Number(row.querySelector('[data-code-field="percent"]').value) || 0,
  }));
}

if (getAuth()) {
  api('GET', '/api/admin/categories').then(showApp).catch(showLogin);
} else {
  showLogin();
}
</script>
</body>
</html>
