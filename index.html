<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>IVA — Цветочная студия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- ====== ЭКРАН 1: Каталог ====== -->
  <div id="screen-catalog" class="screen active">

    <!-- Шапка -->
    <header class="header">
      <div class="header__left">
        <div class="logo">
          <svg class="logo__icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c-4-3-8-7.5-8-12a8 8 0 0 1 16 0c0 4.5-4 9-8 12Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span class="logo__text">ИВА</span>
        </div>
        <p class="header__sub">Цветочная студия · Белгород</p>
      </div>
      <div class="header__right">
        <button class="cart-btn" id="cartBtn" onclick="app.showCart()">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="cart-btn__count" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <!-- Промо-баннер -->
    <section class="promo" id="promoBanner">
      <div class="promo__content">
        <span class="promo__emoji" id="promoEmoji">🌿</span>
        <div>
          <h2 class="promo__title" id="promoTitle">Букет дня</h2>
          <p class="promo__text" id="promoText">Нежный минимал — сегодня со скидкой</p>
        </div>
      </div>
    </section>

    <!-- CTA: Собрать букет -->
    <button class="cta-build" id="ctaBuild" onclick="app.showConstructor()">
      <span>Собрать свой букет</span>
    </button>

    <!-- Скидка-плашка (если включена в админке) -->
    <div class="sale-strip" id="saleStrip" style="display:none"></div>

    <!-- Категории -->
    <nav class="categories" id="categories"></nav>

    <!-- Сортировка -->
    <div class="sort-bar">
      <select id="sort">
        <option value="popular">По популярности</option>
        <option value="price_asc">Цена ↑</option>
        <option value="price_desc">Цена ↓</option>
        <option value="new">Новинки</option>
      </select>
    </div>

    <!-- Сетка товаров -->
    <section class="grid" id="grid"></section>
  </div>

  <!-- ====== ЭКРАН 2: Карточка товара ====== -->
  <div id="screen-product" class="screen">
    <div class="product-page" id="productPage"></div>
  </div>

  <!-- ====== ЭКРАН 3: Корзина ====== -->
  <div id="screen-cart" class="screen">
    <header class="header header--inner">
      <button class="back-btn" onclick="app.showCatalog()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h2 class="header__title">Корзина</h2>
      <div style="width:22px"></div>
    </header>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer" id="cartFooter"></div>
  </div>

  <!-- ====== ЭКРАН 4: Оформление заказа ====== -->
  <div id="screen-checkout" class="screen">
    <header class="header header--inner">
      <button class="back-btn" onclick="app.showCart()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h2 class="header__title">Оформление</h2>
      <div style="width:22px"></div>
    </header>
    <form class="checkout-form" id="checkoutForm" onsubmit="return app.submitOrder(event)">
      <label class="field">
        <span class="field__label">Ваше имя</span>
        <input type="text" name="name" placeholder="Анна" required>
      </label>
      <label class="field">
        <span class="field__label">Телефон</span>
        <input type="tel" name="phone" placeholder="+7 (999) 123-45-67" required>
      </label>

      <div class="field">
        <span class="field__label">Доставка</span>
        <div class="radio-group">
          <label class="radio-pill">
            <input type="radio" name="delivery" value="delivery" checked>
            <span>Доставка</span>
          </label>
          <label class="radio-pill">
            <input type="radio" name="delivery" value="pickup">
            <span>Самовывоз</span>
          </label>
        </div>
      </div>

      <label class="field" id="addressField">
        <span class="field__label">Адрес</span>
        <input type="text" name="address" placeholder="ул. Попова 23, кв. 5">
      </label>

      <label class="field">
        <span class="field__label">Дата</span>
        <input type="date" name="date" required>
      </label>
      <label class="field">
        <span class="field__label">Время</span>
        <select name="time">
          <option value="09-12">09:00 — 12:00</option>
          <option value="12-15">12:00 — 15:00</option>
          <option value="15-18">15:00 — 18:00</option>
          <option value="18-21">18:00 — 21:00</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Комментарий</span>
        <textarea name="comment" rows="3" placeholder="Пожелания к заказу..."></textarea>
      </label>

      <div class="checkout-total" id="checkoutTotal"></div>

      <button type="submit" class="btn btn--primary btn--lg">Отправить заказ</button>
    </form>
  </div>

  <!-- ====== ЭКРАН: Конструктор букета (мастер 3 шага) ====== -->
  <div id="screen-constructor" class="screen">
    <header class="header header--inner">
      <button class="back-btn" onclick="app.constructorBack()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h2 class="header__title" id="constructorHeaderTitle">Собрать букет</h2>
      <div style="width:22px"></div>
    </header>

    <div class="constructor__steps">
      <div class="constructor__step-dot active" data-step="1"></div>
      <div class="constructor__step-dot" data-step="2"></div>
      <div class="constructor__step-dot" data-step="3"></div>
    </div>

    <div id="constructorBody"></div>

    <div class="const-nav" id="constructorNav"></div>
  </div>

  <!-- ====== ЭКРАН 5: Спасибо ====== -->
  <div id="screen-thanks" class="screen">
    <div class="thanks">
      <div class="thanks__icon">✓</div>
      <h2 class="thanks__title">Заказ оформлен!</h2>
      <p class="thanks__text">Менеджер свяжется с вами<br>в ближайшее время</p>
      <button class="btn btn--primary" onclick="app.showCatalog()">Вернуться в каталог</button>
    </div>
  </div>

  <!-- Falling petals -->
  <div class="petals-container" id="petals"></div>
  <script>
    (function(){
      const c = document.getElementById("petals");
      for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.className = "petal";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (8 + Math.random() * 12) + "s";
        p.style.animationDelay = (Math.random() * 10) + "s";
        c.appendChild(p);
      }
    })();
  </script>

  <script src="data.js?v=25"></script>
  <script src="app.js?v=25"></script>
</body>
</html>
